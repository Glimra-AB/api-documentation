openapi: 3.0.0
info:
  title: 4c Forecourt API
  version: 0.1.0

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    AcceptLanguage:
      in: header
      name: Accept-Language
      required: false
      schema:
        type: string
        enum: [sv, en, dk]
  schemas:
    Token:
      type: object
      properties:
        token:
          type: string
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    Site:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        country:
          type: string
        address:
          type: string
    Stall:
      type: object
      properties:
        id:
          type: string
        number:
          type: integer
        display_name:
          type: string
        type:
          type: string
          enum: [manual, automatic, vacuum]
        status:
          type: string
          enum: [available, occupied, out_of_service]
    Product:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        ax_article_number:
          type: string
          format: uuid          
        type:
          type: string
          enum: [manual, automatic, vacuum]
        name:
          type: string
        price:
          type: integer
        currency:
          type: string
    Activation:
      type: object
      properties:
        id:
          type: string
        stall_id:
          type: string
        state:
          type: string
          enum: [queued, starting, washing, completed, canceled, failed, expired]
        queue_position:
          type: integer
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        expected_end_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true

security:
  - BearerAuth: []

paths:
  /api/4c/login:
    post:
      summary: Login
      description: DRF rest_auth login endpoint exposed for forecourt systems.
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
              required: [password]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/4c/sites:
    get:
      summary: List sites
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Site'
  /api/4c/sites/{site_id}/stalls:
    get:
      summary: List stalls for a site
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: site_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stall'
  /api/4c/stalls/{stall_id}:
    get:
      summary: Get a stall
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: stall_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stall'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/4c/stalls/{stall_id}/products:
    get:
      summary: List products for a stall
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: stall_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /api/4c/stalls/{stall_id}/activations:
    post:
      summary: Create activation
      parameters:
        - name: stall_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_uuid:
                  type: string
                  format: uuid
              required: [product_uuid]
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
        '202':
          description: Accepted
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/4c/activations/{activation_id}:
    get:
      summary: Get activation
      parameters:
        - name: activation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'